<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información de donación 💸</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    .inicio {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #222;
      padding: 30px;
      border-radius: 22px;
      max-width: 430px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    h1 { margin-top: 0; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 24px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #111;
      color: white;
    }
    #screamer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }
    #screamer img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mensaje {
      position: relative;
      z-index: 2;
      margin-top: auto;
      margin-bottom: 35px;
      padding: 14px 18px;
      max-width: 90%;
      background: rgba(0,0,0,.78);
      border-radius: 14px;
      font-size: clamp(17px, 4vw, 25px);
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }
    .cerrar {
      position: relative;
      z-index: 3;
      margin-bottom: 20px;
      font-size: 14px;
      padding: 10px 16px;
    }
  </style>
</head>
<body>
  <main class="inicio">
    <div class="card">
      <h1>💸 Información de donación 💸</h1>
      <p>Haz clic abajo para ver cómo donar 👀</p>
      <button id="entrar">VER INFORMACIÓN</button>
    </div>
  </main>

  <audio id="sustoAudio" preload="auto">
    <source src="screamer.mp3" type="audio/mpeg">
  </audio>

  <section id="screamer" aria-hidden="true">
    <img src="screamer.png" alt="Sorpresa">
    <div class="mensaje">
      EL QUE ENTRÓ ES PENDEJO 😭<br><br>
      Pero si me quieren donar, me hablan al priv en mi IG
      y les paso mis datos pa' que me den una lukita por lo menos 💸🙏
    </div>
    <button class="cerrar" id="cerrar">YA, YA ENTENDÍ 😭</button>
  </section>

  <script>
    const entrar = document.getElementById("entrar");
    const cerrar = document.getElementById("cerrar");
    const screamer = document.getElementById("screamer");
    const sustoAudio = document.getElementById("sustoAudio");

    entrar.addEventListener("click", () => {
      screamer.style.display = "flex";
      screamer.setAttribute("aria-hidden", "false");

      // El clic del usuario permite reproducir el audio en la mayoría de navegadores.
      sustoAudio.currentTime = 0;
      sustoAudio.play().catch(() => {});

      // Vibración opcional en celulares compatibles.
      if (navigator.vibrate) navigator.vibrate([120, 60, 180]);
    });

    cerrar.addEventListener("click", () => {
      screamer.style.display = "none";
      screamer.setAttribute("aria-hidden", "true");
      sustoAudio.pause();
      sustoAudio.currentTime = 0;
    });
  </script>
</body>
</html>
